<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Monitoring Student</title>
  <desc id="desc">Aperçu de la plateforme de suivi des élèves Monitoring Student</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#141d31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#24314a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <circle cx="1030" cy="120" r="150" fill="#3b82f6" opacity="0.10"/>
  <circle cx="1030" cy="120" r="100" fill="#3b82f6" opacity="0.10"/>

  <g transform="translate(120 170)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#141d31" stroke="#24314a" stroke-width="2"/>
    <g transform="translate(16 20)">
      <path d="M32 8 62 22 32 36 2 22Z" fill="url(#cap)"/>
      <path d="M14 28v14c0 7 8 12 18 12s18-5 18-12V28l-18 8Z" fill="#3b82f6" opacity="0.85"/>
      <path d="M62 22v18" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
      <circle cx="62" cy="44" r="4" fill="#60a5fa"/>
    </g>
  </g>

  <text x="120" y="330" font-family="'Space Grotesk', 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="600" letter-spacing="6" fill="#60a5fa">PLATEFORME WEB</text>

  <text x="120" y="420" font-family="'Space Grotesk', 'Segoe UI', Inter, sans-serif" font-size="82" font-weight="700" fill="#ffffff">Monitoring Student</text>

  <text x="120" y="480" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" fill="#94a3b8">Suivi des élèves, des travaux et de leur progression.</text>

  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="22" font-weight="600">
    <rect x="120" y="540" width="130" height="52" rx="26" fill="#141d31" stroke="#24314a" stroke-width="2"/>
    <text x="185" y="573" text-anchor="middle" fill="#e2e8f0">HTML</text>

    <rect x="266" y="540" width="110" height="52" rx="26" fill="#141d31" stroke="#24314a" stroke-width="2"/>
    <text x="321" y="573" text-anchor="middle" fill="#e2e8f0">CSS</text>

    <rect x="392" y="540" width="180" height="52" rx="26" fill="#141d31" stroke="#24314a" stroke-width="2"/>
    <text x="482" y="573" text-anchor="middle" fill="#e2e8f0">JavaScript</text>

    <rect x="588" y="540" width="170" height="52" rx="26" fill="#141d31" stroke="#24314a" stroke-width="2"/>
    <text x="673" y="573" text-anchor="middle" fill="#e2e8f0">Supabase</text>
  </g>

  <g opacity="0.7">
    <rect x="880" y="310" width="230" height="150" rx="20" fill="#141d31" stroke="#24314a" stroke-width="2"/>
    <rect x="906" y="340" width="120" height="14" rx="7" fill="#3b82f6"/>
    <rect x="906" y="372" width="178" height="10" rx="5" fill="#24314a"/>
    <rect x="906" y="396" width="150" height="10" rx="5" fill="#24314a"/>
    <rect x="906" y="426" width="90" height="10" rx="5" fill="#60a5fa" opacity="0.8"/>
  </g>
</svg>
